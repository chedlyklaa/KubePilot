<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kubernetes blue hexagon background (flat-top) -->
  <polygon points="50,3 94.6,27.5 94.6,72.5 50,97 5.4,72.5 5.4,27.5" fill="#326CE5"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="5"/>
  <!-- Center hub -->
  <circle cx="50" cy="50" r="7" fill="white"/>
  <!-- 7 spokes at 51.43° intervals -->
  <g stroke="white" stroke-width="4.5" stroke-linecap="round">
    <line x1="50" y1="20" x2="50" y2="43"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(51.43 50 50)"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(102.86 50 50)"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(154.28 50 50)"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(205.71 50 50)"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(257.14 50 50)"/>
    <line x1="50" y1="20" x2="50" y2="43" transform="rotate(308.57 50 50)"/>
  </g>
</svg>
