# Demo incident for the KubePilot presentation.
# checkout-api crash-loops at startup because DB_HOST is never set on the Deployment.
# The "postgres" Service exists in the namespace, so the correct fix is
#   kubectl set env deployment/checkout-api -n demo DB_HOST=postgres.demo.svc.cluster.local
#
#   kubectl apply -f demo/checkout-api.yaml     # break it
#   kubectl delete ns demo                      # reset between takes
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-api-config
  namespace: demo
data:
  LOG_LEVEL: info
  PAYMENT_PROVIDER: stripe-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: demo
  labels:
    app: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: checkout-api-config
          command:
            - sh
            - -c
            - |
              echo "checkout-api v2.4.1 starting (log_level=$LOG_LEVEL)"
              echo "loading configuration..."
              if [ -z "$DB_HOST" ]; then
                echo "FATAL: required environment variable DB_HOST is not set - cannot connect to database"
                exit 1
              fi
              echo "connected to database at $DB_HOST:5432"
              echo "listening on :8080"
              while true; do sleep 30; echo "health ok"; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
