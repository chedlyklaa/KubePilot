# GENERATED by generate-agents.js — edit that, not this file.
# Cluster gateways: the ONLY agent pods that mount a kubeconfig, each from its own Secret so
# read and write can hold different identities (see target-cluster-rbac.yaml).
---
# k8s-read — read-only gateway (allowlisted kubectl reads, typed read helpers, health verification).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepilot-k8s-read
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-read
  labels: { app.kubernetes.io/name: k8s-read, app.kubernetes.io/part-of: kubepilot, kubepilot/role: agent }
spec:
  replicas: 2
  strategy: { type: RollingUpdate }
  selector: { matchLabels: { app.kubernetes.io/name: k8s-read } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: k8s-read, app.kubernetes.io/part-of: kubepilot, kubepilot/role: agent, kubepilot/cluster-access: "true" }
    spec:
      serviceAccountName: kubepilot-k8s-read
      automountServiceAccountToken: false # no Kubernetes API token in this pod at all
      terminationGracePeriodSeconds: 45   # agentHost drains in-flight tasks for up to 30s on SIGTERM
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: k8s-read
          image: kubepilot
          command: ["node", "agent-services/k8s-read.js"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: kubepilot-env }
            - configMapRef: { name: kubepilot-config }
          env:
            - { name: REDIS_PASS, valueFrom: { secretKeyRef: { name: kubepilot-redis-acl, key: AGENT_PASS } } }
            - { name: REDIS_URL, value: "redis://agent:$(REDIS_PASS)@redis:6379" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: logs, mountPath: /app/logs }
            - { name: kubeconfig, mountPath: /var/run/kubepilot/kubeconfig, readOnly: true }
            - { name: clusters, mountPath: /app/config/clusters.yaml, subPath: clusters.yaml, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - name: kubeconfig
          secret: { secretName: kubepilot-kubeconfig-read }
        - name: clusters
          configMap: { name: kubepilot-clusters }
