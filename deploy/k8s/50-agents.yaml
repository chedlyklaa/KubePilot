# GENERATED by generate-agents.js — edit that, not this file.
# LLM agents: no kubeconfig and no ServiceAccount token — only Redis (mesh:* keys via the
# "agent" ACL user), Mongo where noted, and their LLM endpoint.
---
# investigator — LLM-heavy: scale replicas (or an HPA on mesh:tasks:investigator.investigate lag).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepilot-investigator
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
  labels: { app.kubernetes.io/name: investigator, app.kubernetes.io/part-of: kubepilot, kubepilot/role: agent }
spec:
  replicas: 2
  strategy: { type: RollingUpdate }
  selector: { matchLabels: { app.kubernetes.io/name: investigator } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: investigator, app.kubernetes.io/part-of: kubepilot, kubepilot/role: agent, kubepilot/cluster-access: "false" }
    spec:
      serviceAccountName: kubepilot-investigator
      automountServiceAccountToken: false # no Kubernetes API token in this pod at all
      terminationGracePeriodSeconds: 45   # agentHost drains in-flight tasks for up to 30s on SIGTERM
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: investigator
          image: kubepilot
          command: ["node", "agent-services/investigator.js"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: kubepilot-env }
            - configMapRef: { name: kubepilot-config }
          env:
            - { name: REDIS_PASS, valueFrom: { secretKeyRef: { name: kubepilot-redis-acl, key: AGENT_PASS } } }
            - { name: REDIS_URL, value: "redis://agent:$(REDIS_PASS)@redis:6379" }
            - { name: AGENT_K8S_READ_MODE, value: remote }
            - { name: AGENT_REFLECTION_MODE, value: remote }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: logs, emptyDir: {} }
---
